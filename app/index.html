<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1989fa" />
    <meta name="format-detection" content="telephone=no" />
    <title>风神出勤助手</title>
    <script>/* 默认预警参数预置（只填空，不覆盖已保存的值） */
(function(){try{var D=[["fengshen_duty_enabled","1"],["fengshen_interval_allday_order","30"],["fengshen_interval_allday_duration","30"],["fengshen_interval_current_order","5"],["fengshen_interval_current_duration","5"],["fengshen_duty_threshold_current","15"],["fengshen_duty_threshold_allday","60"],["fengshen_order_lead_current","30"],["fengshen_order_lead_allday","3"],["fengshen_updater_repo","hubiqi/fengshen-attendance"]];for(var i=0;i<D.length;i++){if(localStorage.getItem(D[i][0])===null)localStorage.setItem(D[i][0],D[i][1]);}}catch(e){}})();
</script>
    <style>
      #fe-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:99999}
      #fe-mask.show{display:flex}
      #fe-sheet{width:100%;max-height:78vh;overflow:auto;background:#fff;border-radius:16px 16px 0 0;padding:18px 16px 24px;
        font:15px/1.6 -apple-system,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:#323233;
        transform:translateY(100%);transition:transform .22s ease}
      #fe-mask.show #fe-sheet{transform:translateY(0)}
      #fe-sheet h3{margin:0 0 4px;font-size:17px}
      #fe-sheet .sub{color:#969799;font-size:13px;margin-bottom:12px}
      #fe-sheet .ver{display:flex;align-items:center;justify-content:space-between;gap:10px;
        padding:11px 12px;border:1px solid #ebedf0;border-radius:10px;margin-bottom:8px;cursor:pointer}
      #fe-sheet .ver:active{background:#f7f8fa}
      #fe-sheet .ver.cur{border-color:#1989fa;background:#ecf5ff}
      #fe-sheet .ver .n{font-weight:600}
      #fe-sheet .ver .d{color:#969799;font-size:12px}
      #fe-sheet .tag{font-size:11px;padding:1px 6px;border-radius:8px;background:#1989fa;color:#fff;margin-left:6px}
      #fe-sheet .tag.builtin{background:#969799}
      #fe-sheet .row{display:flex;gap:10px;margin-top:14px}
      #fe-sheet button{flex:1;height:44px;border:0;border-radius:10px;font-size:15px;font-weight:600}
      #fe-sheet .primary{background:#1989fa;color:#fff}
      #fe-sheet .ghost{background:#f2f3f5;color:#323233}
    </style>
    <script type="module">
      /* ============================================================
         前端版本管理器（loader）
         · App 自带一份前端（安装包里的 assets），作为"内置版本"兜底
         · 线上按 版本目录 归档：app/v/<版本>/...   （只增不删，可随时回退）
         · 启动：用用户选定的版本（默认最新）；取不到 → 内置版本
         · 检查：版本列表与当前不一致 → 弹窗让用户确认后再切换
         · 跨域 import 在本地页面上下文执行，localStorage/桥接都不变
         ============================================================ */
      (function () {
        var BASE = 'https://hubiqi.github.io/fengshen-dashboard/app/';
        var PIN = 'fengshen_fe_version';      // 用户选定的版本（空=最新）
        var SKIP = 'fengshen_fe_skip';        // 用户跳过的版本号
        var BUILTIN = '56.1.96';              // 安装包内置的前端版本
        var TIMEOUT = 8000;

        var state = { list: null, current: '', loading: false };

        function $(id) { return document.getElementById(id); }

        function withTimeout(p, ms, tag) {
          return Promise.race([p, new Promise(function (_, rej) {
            setTimeout(function () { rej(new Error(tag + ' 超时')); }, ms);
          })]);
        }

        function loadCss(href) {
          return new Promise(function (res) {
            var l = document.createElement('link');
            l.rel = 'stylesheet'; l.href = href;
            l.onload = res; l.onerror = res;
            document.head.appendChild(l);
          });
        }

        function fetchIndex() {
          if (state.list) return Promise.resolve(state.list);
          return withTimeout(fetch(BASE + 'versions.json', { cache: 'no-store' }).then(function (r) {
            if (!r.ok) throw new Error('versions HTTP ' + r.status);
            return r.json();
          }), TIMEOUT, '版本清单').then(function (j) {
            var arr = (j && j.versions) || [];
            state.list = arr;
            return arr;
          });
        }

        function pickVersion(arr) {
          var pin = localStorage.getItem(PIN) || '';
          if (pin === 'builtin') return null;
          if (pin) {
            for (var i = 0; i < arr.length; i++) if (arr[i].version === pin) return arr[i];
          }
          return arr[0] || null;
        }

        function bootRemote(v) {
          var q = '?v=' + encodeURIComponent(v.version);
          return loadCss(BASE + v.css + q).then(function () {
            return withTimeout(import(BASE + v.entry + q), TIMEOUT, '前端入口');
          });
        }

        function bootBuiltin() {
          return fetch('./manifest.json', { cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (m) {
              return loadCss(m.css).then(function () {
                return import('./' + m.entry);
              });
            })
            .catch(function () {
              return loadCss('./assets/index-SgcNJQPd.css').then(function () {
                return import('./assets/index-DpvE-AlK.js');
              });
            });
        }

        /* ---------- 界面 ---------- */
        function ensureSheet() {
          if ($('fe-mask')) return;
          var w = document.createElement('div');
          w.id = 'fe-mask';
          w.innerHTML = '<div id="fe-sheet"></div>';
          w.addEventListener('click', function (e) { if (e.target === w) closeSheet(); });
          document.body.appendChild(w);
        }
        function openSheet(html) {
          ensureSheet();
          $('fe-sheet').innerHTML = html;
          $('fe-mask').classList.add('show');
        }
        function closeSheet() { var m = $('fe-mask'); if (m) m.classList.remove('show'); }

        function askUpdate(v) {
          openSheet(
            '<h3>发现前端更新</h3>' +
            '<div class="sub">当前 ' + (state.current || '内置 ' + BUILTIN) + ' → 新版本 ' + v.version + '</div>' +
            (v.notes ? '<div style="color:#646566;font-size:14px;margin-bottom:12px">' + v.notes + '</div>' : '') +
            '<div class="row"><button class="ghost" id="fe-later">稍后</button>' +
            '<button class="primary" id="fe-now">立即更新</button></div>'
          );
          $('fe-later').onclick = function () { localStorage.setItem(SKIP, v.version); closeSheet(); };
          $('fe-now').onclick = function () { switchTo(v.version); };
        }

        function openPicker() {
          ensureSheet();
          openSheet('<h3>前端版本</h3><div class="sub">加载中…</div>');
          fetchIndex().then(function (arr) {
            if (!arr.length) { openSheet('<h3>前端版本</h3><div class="sub">暂时取不到版本列表（可能离线）</div>'); return; }
            var cur = localStorage.getItem(PIN) || arr[0].version;   // 'builtin' 表示用内置
            var html = '<h3>前端版本</h3><div class="sub">选一个版本使用；出问题可随时切回旧版</div>';
            html += '<div class="ver' + (('builtin' === cur) ? ' cur' : '') + '" data-v="builtin">' +
                    '<div><div class="n">内置版本 ' + BUILTIN + '</div><div class="d">安装包自带，离线也能用</div></div>' +
                    '<span class="tag builtin">内置</span></div>';
            arr.forEach(function (v) {
              var isCur = (v.version === cur);
              html += '<div class="ver' + (isCur ? ' cur' : '') + '" data-v="' + v.version + '">' +
                      '<div><div class="n">' + v.version + '</div>' +
                      '<div class="d">' + (v.date || '') + (v.notes ? ' · ' + v.notes : '') + '</div></div>' +
                      (isCur ? '<span class="tag">使用中</span>' : '') + '</div>';
            });
            html += '<div class="row"><button class="ghost" id="fe-close">关闭</button></div>';
            openSheet(html);
            $('fe-close').onclick = closeSheet;
            Array.prototype.forEach.call(document.querySelectorAll('#fe-sheet .ver'), function (el) {
              el.onclick = function () { switchTo(el.getAttribute('data-v')); };
            });
          }).catch(function () {
            openSheet('<h3>前端版本</h3><div class="sub">取不到版本列表（离线或发布中）</div>');
          });
        }

        function switchTo(ver) {
          localStorage.setItem(PIN, ver);   // 'builtin' 也是合法值：强制用安装包自带的前端
          localStorage.removeItem(SKIP);
          closeSheet();
          setTimeout(function () { location.reload(); }, 120);
        }

        /* ---------- 启动 ---------- */
        function start() {
          var host = $('app');
          if (host && host.firstChild) return;

          fetchIndex().then(function (arr) {
            var v = pickVersion(arr);
            if (!v) { var e0 = new Error('已选择内置版本'); e0.builtin = true; throw e0; }
            state.current = v.version;
            try { window.__loader = { source: 'remote', version: v.version, base_ver: BUILTIN }; } catch (e) {}
            return bootRemote(v);
          }).catch(function (e) {
            try {
              window.__loader = { source: 'builtin', version: BUILTIN, remoteFailed: String(e && e.message) };
              console.warn('[loader] 用内置前端：', e && e.message);
            } catch (_) {}
            return bootBuiltin();
          }).catch(function (e) {
            try {
              document.body.innerHTML = '<div style="padding:24px;font:15px/1.7 system-ui;color:#323233">' +
                '<h3 style="margin:0 0 8px">页面加载失败</h3><p style="color:#969799;margin:0">' +
                String((e && e.message) || e) + '</p></div>';
            } catch (_) {}
          }).then(function () {
            // 启动后静默比对版本，有新版且用户没跳过 → 询问
            fetchIndex().then(function (arr) {
              var latest = arr[0];
              if (!latest) return;
              if (latest.version === state.current) return;
              if (localStorage.getItem(PIN) === latest.version) return;
              if (state.current === BUILTIN && localStorage.getItem(PIN) === 'builtin') { /* 仍提示新版 */ }
              if (localStorage.getItem(SKIP) === latest.version) return;
              setTimeout(function () { askUpdate(latest); }, 1200);
            }).catch(function () {});
          });
        }

        /* ---------- 对外接口（供设置页调用） ---------- */
        window.__fe = {
          openPicker: openPicker,
          check: function () { fetchIndex().then(function (arr) {
            var latest = arr[0];
            if (!latest) return;
            if (latest.version === state.current) { alert('前端已是最新版本 ' + latest.version); return; }
            askUpdate(latest);
          }).catch(function () { alert('取不到版本列表，请检查网络'); }); },
          info: function () { return window.__loader || null; }
        };

        // 设置页「检查更新」按钮会调到这里（见 update 模块）
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
        else start();
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- ===== 提醒开工：独立悬浮按钮 + 设置面板（不依赖 Vue 编译产物） ===== -->
    <style>
      #fx-remind-btn{position:fixed;right:14px;bottom:96px;z-index:99998;width:52px;height:52px;border-radius:26px;
        background:#1989fa;color:#fff;border:none;box-shadow:0 3px 10px rgba(0,0,0,.28);font-size:11px;font-weight:600;
        line-height:1.15;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;
        -webkit-tap-highlight-color:transparent}
      #fx-remind-btn.on{background:#07c160}
      #fx-remind-mask{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.45);display:flex;align-items:center;
        justify-content:center;padding:20px}
      #fx-remind-card{background:#fff;border-radius:14px;width:100%;max-width:330px;padding:18px 18px 10px;
        box-shadow:0 8px 30px rgba(0,0,0,.3);font-family:inherit;color:#323233}
      #fx-remind-card h3{margin:0 0 4px;font-size:16px}
      #fx-remind-card .desc{font-size:12px;color:#8a929e;line-height:1.5;margin-bottom:14px}
      #fx-remind-card .row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;
        border-top:1px solid #f2f3f5;font-size:14px}
      #fx-remind-card input[type=number]{width:64px;padding:6px 8px;border:1px solid #dcdee0;border-radius:8px;
        font-size:14px;text-align:center}
      #fx-remind-card .sw{position:relative;width:46px;height:26px;border-radius:13px;background:#dcdee0;
        transition:background .2s;flex:0 0 auto}
      #fx-remind-card .sw.on{background:#07c160}
      #fx-remind-card .sw i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:11px;
        background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
      #fx-remind-card .sw.on i{left:22px}
      #fx-remind-card .btns{display:flex;gap:10px;margin-top:14px}
      #fx-remind-card .btns button{flex:1;padding:11px 0;border-radius:10px;border:none;font-size:14px;font-weight:600}
      #fx-remind-card .ok{background:#1989fa;color:#fff}
      #fx-remind-card .cancel{background:#f2f3f5;color:#646566}
      #fx-remind-toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);z-index:99999;
        background:rgba(0,0,0,.78);color:#fff;padding:9px 16px;border-radius:18px;font-size:13px;max-width:80%;
        text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
      #fx-remind-toast.show{opacity:1}
    </style>

    <button id="fx-remind-btn">提醒<br>开工</button>
    <div id="fx-remind-toast"></div>
    <div id="fx-remind-mask" style="display:none">
      <div id="fx-remind-card">
        <h3>提醒开工</h3>
        <div class="desc">当前时段有排班、且有效时长不走时自动提醒。<br>提醒同时推送钉钉（含名单与站点负责人 @）并发手机通知。</div>
        <div class="row">
          <span>启用自动提醒</span>
          <div class="sw" id="fx-remind-sw"><i></i></div>
        </div>
        <div class="row">
          <span>提醒间隔（分钟）</span>
          <input type="number" id="fx-remind-int" min="1" max="120" value="2">
        </div>
        <div class="btns">
          <button class="cancel" id="fx-remind-close">取消</button>
          <button class="ok" id="fx-remind-save">保存</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var K_EN = 'fengshen_start_remind_enabled', K_IN = 'fengshen_start_remind_interval';
        var btn = document.getElementById('fx-remind-btn');
        var mask = document.getElementById('fx-remind-mask');
        var sw = document.getElementById('fx-remind-sw');
        var input = document.getElementById('fx-remind-int');
        var toastEl = document.getElementById('fx-remind-toast');
        var toastTimer = null;

        function toast(msg) {
          toastEl.textContent = msg;
          toastEl.classList.add('show');
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
        }
        function isOn() { return localStorage.getItem(K_EN) === '1'; }
        function intervalMin() {
          var v = parseInt(localStorage.getItem(K_IN) || '2', 10);
          if (!v || v < 1) v = 2;
          return v;
        }
        function paint() {
          btn.className = isOn() ? 'on' : '';
          btn.innerHTML = isOn() ? '提醒<br>开' : '提醒<br>开工';
        }
        function nativeApi() {
          try {
            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.KeepAlive)
              return window.Capacitor.Plugins.KeepAlive;
          } catch (e) {}
          return null;
        }
        function applyToNative(enabled, interval, cb) {
          var api = nativeApi();
          if (!api || typeof api.setStartRemind !== 'function') {
            toast('已保存，但需新版 APK 才会后台提醒');
            if (cb) cb();
            return;
          }
          api.setStartRemind({ enabled: enabled ? 1 : 0, interval: interval })
            .then(function () { if (cb) cb(); })
            .catch(function (e) { toast('保存失败：' + (e && e.message || e)); if (cb) cb(); });
        }
        function open() {
          sw.className = 'sw' + (isOn() ? ' on' : '');
          input.value = intervalMin();
          mask.style.display = 'flex';
        }
        function close() { mask.style.display = 'none'; }

        btn.addEventListener('click', open);
        document.getElementById('fx-remind-close').addEventListener('click', close);
        mask.addEventListener('click', function (e) { if (e.target === mask) close(); });
        sw.addEventListener('click', function () { sw.classList.toggle('on'); });
        document.getElementById('fx-remind-save').addEventListener('click', function () {
          var on = sw.classList.contains('on');
          var iv = parseInt(input.value, 10);
          if (!iv || iv < 1) iv = 2;
          if (iv > 120) iv = 120;
          localStorage.setItem(K_EN, on ? '1' : '0');
          localStorage.setItem(K_IN, String(iv));
          applyToNative(on, iv, function () { paint(); close(); toast(on ? '已开启，每 ' + iv + ' 分钟提醒' : '已关闭提醒'); });
        });

        paint();
        // 启动时把本地设置同步给原生（保证 App 重装/清缓存后原生仍是最新值）
        setTimeout(function () { applyToNative(isOn(), intervalMin()); }, 3000);
      })();
    </script>

  </body>
</html>
